<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator - Task 3</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main-container {
            background: #ffffff;
            width: 380px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        .header {
            font-weight: bold;
            letter-spacing: 2px;
        }

        .task-box {
            background: #1e4db7;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            margin-left: 8px;
            font-size: 14px;
        }

        h2 {
            color: #1e4db7;
            margin: 15px 0;
            text-decoration: underline;
        }

        .calculator {
            margin-top: 20px;
        }

        #display {
            width: 100%;
            height: 50px;
            font-size: 20px;
            padding: 10px;
            text-align: right;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #e0e0e0;
        }

        button:hover {
            background: #cfcfcf;
        }

        .operator {
            background: #1e4db7;
            color: white;
        }

        .operator:hover {
            background: #163a8c;
        }

        .clear {
            background: #e53935;
            color: white;
        }

        .clear:hover {
            background: #c62828;
        }

        .equal {
            background: #43a047;
            color: white;
            grid-column: span 2;
        }

        .equal:hover {
            background: #2e7d32;
        }

        .demo {
            margin-top: 20px;
            font-weight: bold;
        }

        .demo a {
            margin-left: 10px;
            color: black;
            text-decoration: none;
            border-bottom: 2px solid black;
        }
    </style>
</head>

<body>

<div class="main-container">

    <div class="header">
        LEVEL 1 <span class="task-box">TASK 3</span>
    </div>

    <h2>CALCULATOR</h2>

    <div class="calculator">
        <input type="text" id="display" disabled>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')">/</button>
            <button onclick="appendValue('*')">*</button>
            <button onclick="appendValue('-')">-</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')">+</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>

            <button onclick="appendValue('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <div class="demo">
        FOR DEMO <a href="#">CLICK HERE</a>
    </div>

</div>

<script>
    let display = document.getElementById("display");

    function appendValue(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
